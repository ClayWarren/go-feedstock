name: Go ARM64 environment preflight
on:
  push:
    branches: [codex/go339-environment-preflight]
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'ClayWarren/go-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install checksum-verified upstream Go control
        shell: pwsh
        run: |
          Invoke-WebRequest https://go.dev/dl/go1.27.1.windows-arm64.zip -OutFile "$env:RUNNER_TEMP\go.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\go.zip" -Algorithm SHA256).Hash -ne '13B69B87BB0E83F96BC68560A8CACE7F0343B1E03469F1110EA18D17E3234069') { throw 'Go checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\go.zip" C:\go-control
          'GOROOT=C:\go-control\go' >> $env:GITHUB_ENV
          'GOTOOLCHAIN=local' >> $env:GITHUB_ENV
          'CGO_ENABLED=0' >> $env:GITHUB_ENV
          'C:\go-control\go\bin' >> $env:GITHUB_PATH
      - name: Record certificate baseline and test native Git
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\Git\bin;$env:PATH"
          $env:TMP = "$env:RUNNER_TEMP\go-preflight"
          $env:TEMP = $env:TMP
          New-Item -ItemType Directory $env:TMP -Force | Out-Null
          go env GOHOSTARCH GOARCH GOROOT
          where.exe git
          git version --build-options
          go test -count=1 -v '-run=^Test(Go|System)Verify$/^SHA-384$' crypto/x509
          Write-Host "CERTIFICATE_BASELINE_EXIT=$LASTEXITCODE"
          go test -count=1 -v cmd/go/internal/modfetch/codehost cmd/go/internal/vcweb
          if ($LASTEXITCODE -ne 0) { throw 'Native Git control failed' }
      - name: Verify temporary root lifecycle and unchanged certificate tests
        if: always()
        shell: powershell
        env:
          GO_TEST_ALLOW_TEMPORARY_USER_ROOT: '1'
        run: |
          & ./ci/test_native_trust_lifecycle.ps1 -HelperPath ./ci/run_dist_tests.ps1 -GoRoot C:\go-control\go
          exit $LASTEXITCODE

name: Go ARM64 Mercurial loopback control
on:
  push:
    branches: [codex/go339-hg-loopback]
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'ClayWarren/go-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install checksum-verified upstream Go control
        shell: pwsh
        run: |
          Invoke-WebRequest https://go.dev/dl/go1.27.1.windows-arm64.zip -OutFile "$env:RUNNER_TEMP\go.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\go.zip" -Algorithm SHA256).Hash -ne '13B69B87BB0E83F96BC68560A8CACE7F0343B1E03469F1110EA18D17E3234069') { throw 'Go checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\go.zip" C:\go-control
          'GOROOT=C:\go-control\go' >> $env:GITHUB_ENV
          'GOTOOLCHAIN=local' >> $env:GITHUB_ENV
          'CGO_ENABLED=0' >> $env:GITHUB_ENV
          'C:\go-control\go\bin' >> $env:GITHUB_PATH
      - name: Test Mercurial fixture on explicit loopback
        shell: pwsh
        run: |
          $env:PATH = "$env:ProgramFiles\Git\bin;$env:PATH"
          $file = "$env:GOROOT\src\cmd\go\internal\vcweb\hg.go"
          $source = [IO.File]::ReadAllText($file)
          $old = '"--address", "localhost"'
          if (-not $source.Contains($old)) { throw 'Missing bind expression' }
          $source = $source.Replace($old, '"--address", "127.0.0.1"')
          $anchor = 'if h.url == nil {'
          if (-not $source.Contains($anchor)) { throw 'Missing proxy anchor' }
          $source = $source.Replace($anchor, 'u.Host = "127.0.0.1:" + u.Port()' + "`n`t`t" + $anchor)
          [IO.File]::WriteAllText($file, $source)
          gofmt -w $file
          go test -count=1 -timeout=5m -v cmd/go/internal/modfetch/codehost cmd/go/internal/vcweb
          exit $LASTEXITCODE

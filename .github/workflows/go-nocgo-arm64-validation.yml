# Personal-fork diagnostic workflow. Do not include this in a feedstock PR.
name: Go no-CGo native Windows ARM64 validation
run-name: Go no-CGo ARM64 at ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit on this fork to build and test
        required: true
        type: string

permissions:
  contents: read

jobs:
  nocgo:
    if: github.repository == 'ClayWarren/go-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 360
    steps:
      - name: Validate requested revision
        shell: powershell
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if ($env:REQUESTED_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'source_sha must be a full lowercase commit SHA.'
          }
          Write-Host "Workflow revision: $env:GITHUB_SHA"
          Write-Host "Requested source: $env:REQUESTED_SOURCE_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify checked-out source
        shell: powershell
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:REQUESTED_SOURCE_SHA) {
            throw 'Checked-out source differs from the requested immutable revision.'
          }
          Write-Host "TESTED_SOURCE_SHA=$actual"
          "TESTED_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Source: $actual. One win-arm64 no-CGo job. Package uploads disabled." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Check PowerShell 5.1 regressions before downloading Go
        shell: powershell
        run: |
          & .\ci\test_powershell51_types.ps1
          & .\recipe\nocgo\test_verify_fips_integrity.ps1
          & .\ci\test_windows_api_initialization.ps1

      - name: Prove native PowerShell certificate lifetime
        shell: powershell
        env:
          GO_TEST_ALLOW_TEMPORARY_USER_ROOT: '1'
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOENV: 'off'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $bootstrap = Join-Path $env:RUNNER_TEMP ('go-nocgo-bootstrap-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $bootstrap | Out-Null
          $archive = Join-Path $bootstrap 'go1.27.1.windows-arm64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://go.dev/dl/go1.27.1.windows-arm64.zip' -OutFile $archive
          $expected = '13b69b87bb0e83f96bc68560a8cace7f0343b1e03469f1110ea18d17e3234069'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -cne $expected) {
            throw 'Official Windows ARM64 Go bootstrap checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $bootstrap
          & .\ci\test_native_trust_lifecycle.ps1 -HelperPath .\recipe\windows\run_dist_tests.ps1 -GoRoot (Join-Path $bootstrap 'go')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test the native no-CGo packages without publishing
        shell: cmd
        env:
          CONFIG: win_arm64_cgofalsego_variant_strnocgo
          BUILD_PLATFORM: win-arm64
          HOST_PLATFORM: win-arm64
          CI: github_actions
          CONDA_BLD_PATH: C:\bld\
          MINIFORGE_HOME: C:\Miniforge
          UPLOAD_PACKAGES: 'False'
          PYTHONUNBUFFERED: '1'
        run: |
          set "flow_run_id=github_%GITHUB_RUN_ID%"
          set "remote_url=https://github.com/%GITHUB_REPOSITORY%"
          set "sha=%TESTED_SOURCE_SHA%"
          call ".scripts\run_win_build.bat"

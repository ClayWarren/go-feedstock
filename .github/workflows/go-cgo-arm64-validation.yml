# Personal-fork diagnostic branch only. No Go tests or package builds.
name: Windows ARM64 DLL export smoke test
run-name: Benign ARM64 DLL exports at ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dll-exports:
    if: github.repository == 'ClayWarren/go-feedstock'
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.79.0
          manifest-path: ci/dll-export-smoke/pixi.toml
          locked: true
          cache: false
      - name: Compile, inspect, and load ordinary ARM64 DLLs
        shell: pwsh
        run: |
          pixi list --manifest-path ci/dll-export-smoke/pixi.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pixi run --manifest-path ci/dll-export-smoke/pixi.toml --locked pwsh -NoProfile -File ci/dll-export-smoke/run.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain benign binaries and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64-dll-export-smoke
          path: ci/dll-export-smoke/results/
          if-no-files-found: warn
          retention-days: 7
